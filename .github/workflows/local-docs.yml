name: Docs audit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Testy skryptu
        shell: bash
        run: sh .agents/skills/docs-garden/scripts/test.sh
      - name: Audyt dokumentacji
        shell: bash
        run: sh .agents/skills/docs-garden/scripts/check.sh
      - name: Regresje narzędzi lokalnych
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
